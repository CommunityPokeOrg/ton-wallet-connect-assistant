[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ton-wallet-connect-assistant"
version = "0.1.0"
description = "Desktop assistant for connecting a TON wallet via TonConnect (Telegram wallet flows)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CommunityPoke" }]
dependencies = [
    "PySide6>=6.8,<6.12",
    "pytonconnect>=0.4.0,<0.5",
    "qrcode[pil]>=7.4,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5",
]

[project.scripts]
ton-wallet-assistant = "ton_wallet_assistant.__main__:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
